name: comparator
on:
  pull_request:
    paths: ["harness/compare.py", "harness/test_compare.py", "harness/test_harness.py", "harness/goldens.json", "harness/baseline.json", ".github/workflows/comparator.yml"]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s harness -p test_compare.py
